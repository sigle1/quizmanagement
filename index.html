<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A registration form with client-side validation." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233995d3'/%3E%3Cpath d='M20 31h24M32 19v24' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Register</title>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        color: #2f3a4a;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: min(600px, calc(100% - 32px));
        margin: 32px 16px;
        padding: 48px 45px 44px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 25px rgba(0, 0, 0, .08);
      }

      h1 {
        margin: 7px 0 38px;
        text-align: center;
        font-size: 3.2rem;
        line-height: 1;
      }

      .form-item { margin-bottom: 10px; }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 1.45rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 60px;
        padding: 12px 15px;
        border: 3px solid #d9d9d9;
        border-radius: 6px;
        outline: none;
        color: #2f3a4a;
        font: inherit;
        font-size: 1.22rem;
        transition: border-color .18s ease;
      }

      input::placeholder { color: #6f7782; opacity: 1; }
      input:focus { border-color: #3995d3; }
      .form-item.error input { border-color: #ef493d; }
      .form-item.success input { border-color: #2faf68; }

      small {
        display: block;
        min-height: 20px;
        padding-top: 5px;
        color: #ef493d;
        font-size: 1rem;
        visibility: hidden;
      }

      .form-item.error small { visibility: visible; }

      button {
        width: 100%;
        height: 64px;
        margin-top: -2px;
        border: 0;
        border-radius: 5px;
        background: #3995d3;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 1.3rem;
        transition: background-color .18s ease, transform .18s ease;
      }

      button:hover { background: #2785c5; }
      button:active { transform: translateY(1px); }

      @media (max-width: 520px) {
        .container { padding: 32px 24px; }
        h1 { margin-bottom: 30px; font-size: 2.5rem; }
        label { font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <form id="registration-form" novalidate>
        <h1>Register</h1>

        <div class="form-item">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" />
          <small></small>
        </div>

        <div class="form-item">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Enter email" autocomplete="email" />
          <small></small>
        </div>

        <div class="form-item">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="new-password" />
          <small></small>
        </div>

        <div class="form-item">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" />
          <small></small>
        </div>

        <button type="submit">Register</button>
      </form>
    </main>

    <script>
      const form = document.getElementById("registration-form");
      const username = document.getElementById("username");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const isRequiredValid = checkRequired([username, email, password, confirmPassword]);
        let isFormValid = isRequiredValid;

        if (isRequiredValid) {
          const isUsernameValid = checkLength(username, 3, 15);
          const isEmailValid = checkEmail(email);
          const isPasswordValid = checkLength(password, 6, 15);
          const isPasswordsMatch = checkPasswordsMatch(password, confirmPassword);
          isFormValid = isUsernameValid && isEmailValid && isPasswordValid && isPasswordsMatch;
        }

        if (isFormValid) {
          alert("Registration successful!");
          form.reset();
          document.querySelectorAll(".form-item").forEach((group) => {
            group.className = "form-item";
          });
        }
      });

      function checkRequired(inputs) {
        let isValid = true;
        inputs.forEach((input) => {
          if (input.value.trim() === "") {
            showError(input, `${formatFieldName(input)} is required`);
            isValid = false;
          } else {
            showSuccess(input);
          }
        });
        return isValid;
      }

      function checkLength(input, min, max) {
        if (input.value.length < min) {
          showError(input, `${formatFieldName(input)} must be at least ${min} characters.`);
          return false;
        }
        if (input.value.length > max) {
          showError(input, `${formatFieldName(input)} must be less than ${max} characters.`);
          return false;
        }
        showSuccess(input);
        return true;
      }

      function checkEmail(input) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailRegex.test(input.value.trim())) {
          showSuccess(input);
          return true;
        }
        showError(input, "Email is not valid");
        return false;
      }

      function checkPasswordsMatch(input1, input2) {
        if (input1.value !== input2.value) {
          showError(input2, "Passwords do not match");
          return false;
        }
        showSuccess(input2);
        return true;
      }

      function showError(input, message) {
        const formGroup = input.parentElement;
        formGroup.className = "form-item error";
        formGroup.querySelector("small").innerText = message;
      }

      function showSuccess(input) {
        input.parentElement.className = "form-item success";
      }

      function formatFieldName(input) {
        return input.id.charAt(0).toUpperCase() + input.id.slice(1);
      }
    </script>
  </body>
</html>
